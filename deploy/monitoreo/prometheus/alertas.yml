groups:
  - name: disponibilidad
    rules:
      - alert: ServicioCaido
        expr: up{job=~"api|front"} == 0
        for: 1m
        labels: { severidad: critica }
        annotations:
          resumen: "{{ $labels.job }} no responde"
          descripcion: "Prometheus no puede leer /actuator/prometheus de {{ $labels.instance }} desde hace mas de 1 minuto."

  - name: aplicacion
    rules:
      - alert: TasaErrores5xxAlta
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (job) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 2m
        labels: { severidad: alta }
        annotations:
          resumen: "{{ $labels.job }}: mas del 5% de respuestas 5xx"
          descripcion: "Tasa de error actual: {{ $value | humanizePercentage }}."

      - alert: LatenciaP95Alta
        expr: |
          histogram_quantile(0.95, sum by (job, le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))) > 1
        for: 3m
        labels: { severidad: media }
        annotations:
          resumen: "{{ $labels.job }}: latencia p95 mayor a 1 s"
          descripcion: "p95 actual: {{ $value | humanizeDuration }}."

      - alert: HeapJVMAlto
        expr: |
          sum by (job) (jvm_memory_used_bytes{area="heap"}) / sum by (job) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
        for: 5m
        labels: { severidad: media }
        annotations:
          resumen: "{{ $labels.job }}: heap de la JVM arriba del 90%"

  - name: infraestructura
    rules:
      - alert: CPUAltaVM
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 5m
        labels: { severidad: alta }
        annotations:
          resumen: "CPU de la VM arriba del 85%"
          descripcion: "Uso actual: {{ $value | printf \"%.1f\" }}%."

      - alert: MemoriaAltaVM
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels: { severidad: alta }
        annotations:
          resumen: "Memoria de la VM arriba del 90%"

      - alert: DiscoCasiLleno
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"}) > 85
        for: 10m
        labels: { severidad: media }
        annotations:
          resumen: "Disco raiz de la VM arriba del 85%"
