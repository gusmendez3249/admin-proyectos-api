global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    entorno: azure

rule_files:
  - /etc/prometheus/alertas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Aplicacion: metricas de Spring Boot Actuator + Micrometer
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]
        labels: { servicio: api }

  - job_name: front
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["front:8082"]
        labels: { servicio: front }

  # Infraestructura: CPU, memoria, disco y red de la VM
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { servicio: vm }

  # Recursos por contenedor
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Solo los contenedores de docker compose (descarta series de cgroups del sistema)
      - source_labels: [container_label_com_docker_compose_service]
        regex: ""
        action: drop
