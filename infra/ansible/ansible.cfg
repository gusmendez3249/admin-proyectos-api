[defaults]
inventory = inventario.ini
private_key_file = /root/.ssh/id_vm
stdout_callback = default
result_format = yaml
retry_files_enabled = false
interpreter_python = auto_silent

[ssh_connection]
# Acepta la huella de la VM la primera vez y la verifica despues
ssh_args = -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30
pipelining = true
