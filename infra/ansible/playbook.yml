# Configuracion de la VM creada por Terraform y despliegue de la aplicacion.
# Idempotente: se puede ejecutar varias veces; solo cambia lo necesario.
# Ejecucion: ver ../README.md (se corre dentro de un contenedor, no requiere Ansible en Windows)
- name: Configurar servidor y desplegar admin-proyectos
  hosts: app
  become: true
  vars:
    repo_api: https://github.com/gusmendez3249/admin-proyectos-api.git
    rama: main
    dir_app: /opt/admin-proyectos
    # Secretos: nunca se escriben en el repositorio. Prioridad:
    #   1) los que ya existen en el .env de la VM (PostgreSQL y Grafana solo aceptan la
    #      contrasena con la que se inicializaron, asi que se conservan entre despliegues)
    #   2) variables de entorno DB_PASSWORD / GRAFANA_ADMIN_PASSWORD
    #   3) una contrasena aleatoria de 24 caracteres generada en la primera instalacion
    pw_aleatoria: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=24) }}"

  pre_tasks:
    - name: Esperar a que la VM acepte conexiones SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Leer el .env existente (si ya hubo un despliegue)
      ansible.builtin.slurp:
        src: "{{ dir_app }}/deploy/.env"
      register: env_actual
      failed_when: false
      no_log: true

    - name: Resolver contrasenas (conservar las existentes)
      ansible.builtin.set_fact:
        db_password: >-
          {{ (env_actual.content | default('') | b64decode | regex_search('(?m)^DB_PASSWORD=(.+)$', '\1') | default([], true) | first)
             | default(lookup('env', 'DB_PASSWORD'), true) | default(pw_aleatoria, true) }}
        grafana_password: >-
          {{ (env_actual.content | default('') | b64decode | regex_search('(?m)^GRAFANA_ADMIN_PASSWORD=(.+)$', '\1') | default([], true) | first)
             | default(lookup('env', 'GRAFANA_ADMIN_PASSWORD'), true) | default(lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=24), true) }}
      no_log: true

    - name: Validar longitud minima de las contrasenas
      ansible.builtin.assert:
        that:
          - db_password | length >= 12
          - grafana_password | length >= 12
        fail_msg: "Las contrasenas deben tener al menos 12 caracteres"
      no_log: true

  # Sistema base, swap, SSH en 443 y Docker: rol comun con la VM de CI (roles/base_docker)
  roles:
    - base_docker

  tasks:
    # ---------- Aplicacion ----------
    - name: Clonar o actualizar el repositorio de la API
      ansible.builtin.git:
        repo: "{{ repo_api }}"
        dest: "{{ dir_app }}"
        version: "{{ rama }}"
        force: true
      register: repo

    - name: Generar archivo .env con permisos restringidos
      ansible.builtin.copy:
        dest: "{{ dir_app }}/deploy/.env"
        mode: "0600"
        content: |
          DB_USERNAME=gestor
          DB_PASSWORD={{ db_password }}
          GRAFANA_ADMIN_PASSWORD={{ grafana_password }}
          APP_VERSION={{ repo.after[:7] }}
          API_PORT=8081
          FRONT_PORT=8082
          COMPOSE_PATH_SEPARATOR=:
          COMPOSE_FILE=docker-compose.yml:docker-compose.monitoreo.yml
      no_log: true

    - name: Construir y levantar los contenedores
      ansible.builtin.command: docker compose up -d --build --remove-orphans
      args:
        chdir: "{{ dir_app }}/deploy"
      register: compose
      changed_when: "'Started' in compose.stderr or 'Recreated' in compose.stderr or 'Built' in compose.stderr"

    - name: Recargar la configuracion de monitoreo si cambio el repositorio
      # Prometheus, Alertmanager y Alloy leen su configuracion al arrancar (bitacora #15)
      ansible.builtin.command: docker compose restart prometheus alertmanager alloy
      args:
        chdir: "{{ dir_app }}/deploy"
      when: repo.changed

    - name: Reiniciar cAdvisor si se recrearon contenedores
      # cAdvisor no detecta los contenedores que Docker recrea despues de que el arranco
      # (Docker 29 + factoria de containerd): sin esto, los paneles por contenedor quedan vacios (bitacora #19)
      ansible.builtin.command: docker compose restart cadvisor
      args:
        chdir: "{{ dir_app }}/deploy"
      when: compose.changed

    # ---------- Limpieza de disco (bitacora #19) ----------
    - name: Eliminar imagenes de versiones anteriores de la aplicacion
      # Cada despliegue etiqueta las imagenes con el commit; se conserva solo la version actual
      ansible.builtin.shell: >-
        docker images --format '{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}'
        | grep -E '^admin-proyectos-(api|front):'
        | grep -v ':{{ repo.after[:7] }}$'
        | xargs -r docker rmi
      register: imagenes_viejas
      changed_when: imagenes_viejas.stdout | length > 0

    - name: Eliminar imagenes huerfanas y cache de compilacion de mas de 3 dias
      ansible.builtin.shell: docker image prune -f && docker builder prune -af --filter until=72h
      register: limpieza
      changed_when: "'Total reclaimed space: 0B' not in limpieza.stdout"

    # ---------- Verificacion ----------
    - name: Esperar a que el front responda saludable
      # Actuator esta en un puerto interno: se usa el HEALTHCHECK de Docker (que consulta /actuator/health)
      ansible.builtin.command: docker inspect --format '{{ '{{' }}.State.Health.Status{{ '}}' }}' admin-proyectos-front-1
      register: salud
      changed_when: false
      until: salud.stdout == 'healthy'
      retries: 30
      delay: 10

    - name: Esperar a que Grafana y Prometheus respondan
      ansible.builtin.uri:
        url: "{{ item }}"
      register: monitoreo
      until: monitoreo.status == 200
      retries: 18
      delay: 10
      loop:
        - http://localhost:3000/api/health
        - http://localhost:9090/-/ready

    - name: Verificar que Prometheus lee todos los objetivos
      ansible.builtin.uri:
        url: http://localhost:9090/api/v1/targets?state=active
        return_content: true
      register: objetivos
      until: objetivos.json.data.activeTargets | selectattr('health', 'equalto', 'up') | list | length == objetivos.json.data.activeTargets | length
      retries: 12
      delay: 10

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg: >-
          Desplegada la version {{ repo.after[:7] }}.
          Front: http://{{ inventory_hostname }}:8082 |
          Grafana: http://{{ inventory_hostname }}:3000 |
          Objetivos de Prometheus activos: {{ objetivos.json.data.activeTargets | length }}
