spring.application.name=Ejercicio5MyAPIGestor
server.port=8081
# PostgreSQL: los datos de conexion se leen de variables de entorno (no se suben contrasenas al repo)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbgestor}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# No se registran las sentencias SQL salvo que se pida (JPA_SHOW_SQL=true)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update
# Monitoreo (Actuator + Micrometer). Los endpoints de administracion van en un puerto interno
# (MANAGEMENT_PORT) que no se publica fuera de la red de Docker: solo Prometheus y el HEALTHCHECK lo usan.
# Hallazgo de Semgrep (spring-actuator-dangerous-endpoints-enabled), ver bitacora #14.
management.server.port=${MANAGEMENT_PORT:9081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
