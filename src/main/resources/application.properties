spring.application.name=Ejercicio5MyAPIGestor
server.port=8081
# PostgreSQL: los datos de conexion se leen de variables de entorno (no se suben contrasenas al repo)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbgestor}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
