spring.application.name=Ejercicio5MyAPIGestor
# Pruebas: H2 en memoria en modo PostgreSQL (no requiere servidor de BD)
spring.datasource.url=jdbc:h2:mem:dbgestor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
